{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Herbaria{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'Plantas/style.css' %}">
</head>
<body>
<header>
    <h1>Herbaria</h1>
    <nav>
        <a href="{% url 'plantas:planta_listar' %}">Plantas</a>
        <a href="{% url 'plantas:categoria_listar' %}">Categorias</a>
        <a href="{% url 'plantas:cuidado_listar' %}">Cuidados</a>
        <a href="{% url 'plantas:fotografia_listar' %}">Fotografias</a>
    </nav>
</header>
<main>
    {% for message in messages %}<p class="mensagem">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
